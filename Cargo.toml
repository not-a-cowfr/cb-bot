[package]
name = "cb-bot"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
incremental = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = true

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
dotenv = "0.15.0"
poise = "0.6.1"
reqwest = { version = "0.13.2", features = ["multipart"] }
serenity = "0.12.5"
tokio = { version = "1.49.0", features = ["full"] }
